defaults:
  - override hydra/launcher: ray

hydra:
  sweeper:
    params:
      seed: 42
      env.length: 20

env:
  name: Umbrella
  length: 50

# Common Parameters
seed: 42  # Default seed (overridden by sweeper)
env_steps: 100000

# PPO Learner Config
ppo_learner:
  minibatch_size: 494
  lr: 0.000631317558363
  num_epochs: 4
  shuffle_batch_per_epoch: true
  num_learners: 0

# Training settings
training:
  gamma: 1
  train_batch_size_per_learner: 5000

# PPO Algorithm Parameters
ppo:
  use_critic: true
  use_gae: true
  lambda_: 0.9772571476659
  use_kl_loss: true
  kl_coeff: 0.325627658057
  kl_target: 0.0141406772766
  vf_loss_coeff: 0.6946008393671
  entropy_coeff: 0.0034828119666
  clip_param: 0.1201556002755
  vf_clip_param: 0.4610211626718
  grad_clip: 0.5
  hidden_size_1: 146
  hidden_size_2: 145


# Environment Runner Settings
env_runners:
  num_env_runners: 0
  num_cpus_per_env_runner: 1
  num_envs_per_env_runner: 1
  gym_env_vectorize_mode: "SYNC"
  batch_mode: "truncate_episodes"

# Evaluation Settings
evaluation:
  evaluation_interval: 1
  evaluation_duration: 50
  evaluation_duration_unit: "episodes"
  evaluation_force_reset_envs_before_iteration: true
  evaluation_num_env_runners: 1


# System resources
num_cpus_for_main_process: 1
data_dir: ./experiment/PPO/



